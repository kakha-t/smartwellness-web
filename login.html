<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Login – SmartWellness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <h1 class="logo">
    <a href="index.html" style="text-decoration: none; color: inherit;">SmartWellness</a>
  </h1>
  <div class="nav-user-container">
    <div class="nav-user-combined">
      <nav class="navigation">
        <a href="gesunde_ernaehrung.html">Ernährung & Rezepte</a>
        <a href="fitness_bewegung.html">Fitness & Bewegung</a>
      </nav>
    </div>
  </div>
</header>

  <main class="main-register">
    <a href="zugang.html" class="zurueck-icon" title="Zurück">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="green" viewBox="0 0 24 24">
            <path d="M15.5 5l-7 7 7 7" stroke="green" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </a>
    <h2>Login</h2>

    <form id="login-form" class="form-box">
      <label for="email">E-Mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Passwort:</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Einloggen</button>
    </form>

    <!-- Fehlerausgabe -->
    <div id="login-error" class="error-message"></div>

    <p>Noch kein Konto? <a href="register.html">Jetzt registrieren</a></p>
  </main>

  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const form = e.target;
      const formData = new FormData(form);
      const errorDiv = document.getElementById("login-error");
      errorDiv.textContent = ""; // Alte Fehler löschen

      fetch("login.php", {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          window.location.href = "ernaehrungsplan.html";
        } else {
          errorDiv.innerHTML = `⚠️ ${data.message}`;
        }
      })
      .catch(err => {
        errorDiv.textContent = "⚠️ Serverfehler. Bitte später erneut versuchen.";
      });
    });
  </script>
  <footer class="footer">
  <p>&copy; 2025 SmartWellness – <a href="impressum.html">Impressum</a> | <a href="datenschutz.html">Datenschutz</a></p>
</footer>
</body>
</html>
